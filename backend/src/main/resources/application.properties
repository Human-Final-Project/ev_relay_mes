spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]
spring.application.name=ev-relay-mes

# 1. Database Configuration (MySQL)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}

#
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. JPA Configuration
spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# 2-1. Initial master data
# Hibernate creates the schema first, then Spring runs data.sql on every startup.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# 3. Server Port
server.port=${SERVER_PORT:8111}

# 3-1. L2 Collector authentication
mes.collector.api-key=${MES_COLLECTOR_API_KEY}

# 4. OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.csrf.enabled=true

# 5. Automatic LOT lifecycle recovery
# Normal flow runs immediately through transaction events; these schedules are recovery safety nets.
mes.auto-lot.reconcile-enabled=true
mes.auto-lot.reconcile-initial-delay-ms=5000
mes.auto-lot.reconcile-delay-ms=5000
mes.auto-lot.material-reconcile-enabled=true
mes.auto-lot.material-reconcile-initial-delay-ms=5000
mes.auto-lot.material-reconcile-delay-ms=5000

# 5-1. Pipeline command recovery
# Clears active commands left on terminal LOTs and retries assignment for IDLE machines.
mes.pipeline.reconcile-enabled=true
mes.pipeline.reconcile-initial-delay-ms=3000
mes.pipeline.reconcile-delay-ms=3000
